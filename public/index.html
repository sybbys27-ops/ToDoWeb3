    <script>
        const START_WIDTH = 420;  
        const START_HEIGHT = 600; 

        document.addEventListener('DOMContentLoaded', () => {
            const isPopup = (window.name === 'todoAppPopup');

            if (!isPopup) {
                document.getElementById('launch-app-btn').addEventListener('click', () => {
                    const features = `width=${START_WIDTH},height=${START_HEIGHT},toolbar=no,location=no,status=no,menubar=no,scrollbars=no,resizable=yes`;
                    window.open(window.location.href, 'todoAppPopup', features);
                    window.open('', '_self', '');
                    window.close();
                });
            } else {
                document.getElementById('launcher-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                initApp(START_WIDTH, START_HEIGHT);
                setupPinLock(); 
            }
        });

        function initApp(defaultWidth, defaultHeight) {
            const input = document.getElementById('todo-input');
            const addBtn = document.getElementById('add-btn');
            const todoList = document.getElementById('todo-list');
            const importBtn = document.getElementById('import-btn');
            const exportBtn = document.getElementById('export-btn');
            const googleBtn = document.getElementById('google-btn');
            const papagoBtn = document.getElementById('papago-btn'); 
            const fileInput = document.getElementById('file-input');
            
            const appTitle = document.getElementById('app-title');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const todoView = document.getElementById('todo-view');
            const memoView = document.getElementById('memo-view');
            const colorToolView = document.getElementById('color-tool-view');
            const websiteToolView = document.getElementById('website-tool-view');
            const geminiView = document.getElementById('gemini-view');

            let fileHandle = null; 
            let isUserResized = false;
            let isAutoResizing = false;
            
            // [수정] 탭 상태 관리 변수
            let currentTab = '1';
            let appData = { '1': [] }; // 1번 탭 투두 데이터 객체

            window.addEventListener('resize', () => {
                if (!isAutoResizing) isUserResized = true;
            });

            // 이 버전 전용 저장소입니다. 다른 학습 버전과 데이터를 공유하지 않습니다.
            const STORAGE_KEY = 'todoweb3_todos';
            let websiteTool = null;

            function resizeWindowToContent() {
                if (isUserResized) return; 
                const contentHeight = 180 + todoList.scrollHeight;
                const newHeight = Math.max(defaultHeight, contentHeight); 
                
                isAutoResizing = true; 
                window.resizeTo(defaultWidth, newHeight); 
                setTimeout(() => { isAutoResizing = false; }, 100);
            }

            // [수정완료] 현재 UI의 리스트를 읽어들여 1번 탭 데이터로 저장
            function saveToStorage() {
                if (currentTab !== '1') return; // 1번 탭만 할 일 관리이므로 다른 탭은 투두 저장 건너뜀
                try {
                    const todos = [];
                    const items = todoList.querySelectorAll('li');
                    items.forEach(item => {
                        const textSpan = item.querySelector('.todo-text');
                        todos.push({ text: textSpan.textContent, isDone: textSpan.classList.contains('done') });
                    });
                    
                    appData[currentTab] = todos; // 현재 탭 배열 갱신
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); // 전체 객체 저장
                } catch(e) {}
            }

            function createTodoElement(text, isDone) {
                const newLi = document.createElement('li');
                const textSpan = document.createElement('span');
                textSpan.className = 'todo-text';
                textSpan.textContent = text;
                if (isDone) textSpan.classList.add('done');
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '❌';

                newLi.appendChild(textSpan);
                newLi.appendChild(delBtn);
                todoList.appendChild(newLi);
            }

            // [수정완료] 화면에 현재 탭의 데이터만 렌더링하는 전용 함수
            function renderCurrentTab() {
                todoList.innerHTML = ''; 
                const currentTodos = appData[currentTab] || [];
                
                if (currentTodos.length > 0) {
                    currentTodos.forEach(todo => createTodoElement(todo.text, todo.isDone));
                } else if (currentTab === '1' && Object.keys(appData).every(k => appData[k].length === 0)) {
                    // 최초 실행 시 1번 탭에만 안내 문구 표시
                    createTodoElement('기본 항목 (클릭하면 줄이 그어져요)', false);
                    createTodoElement('우측의 ❌를 누르면 삭제됩니다.', false);
                    saveToStorage();
                }
                setTimeout(resizeWindowToContent, 50);
            }

            // [수정완료] 데이터 불러오기 (구버전 호환성 포함)
            function loadFromStorage() {
                try {
                    const rawData = localStorage.getItem(STORAGE_KEY);
                    if (rawData && rawData !== '[]' && rawData !== '{}') {
                        const parsedData = JSON.parse(rawData);
                        
                        // 구버전(단일 배열 형식) 또는 객체 데이터를 불러와 1번 탭으로 매핑
                        if (Array.isArray(parsedData)) {
                            appData['1'] = parsedData;
                        } else {
                            appData = {
                                '1': parsedData['1'] || []
                            };
                        }
                    }
                } catch(e) {}
                renderCurrentTab();
            }

            // 메모 HTML에서 허용된 서식과 안전한 웹 링크만 보존합니다.
            function sanitizeMemoHTML(html) {
                const parsed = new DOMParser().parseFromString(String(html || ''), 'text/html');
                const cleanRoot = document.createElement('div');
                const allowedTags = new Set(['A', 'B', 'BLOCKQUOTE', 'BR', 'CODE', 'DEL', 'DIV', 'EM', 'FONT', 'I', 'LI', 'OL', 'P', 'S', 'SPAN', 'STRONG', 'U', 'UL']);
                const blockedTags = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH', 'TEMPLATE']);

                function copySafeNode(source, destination) {
                    if (source.nodeType === Node.TEXT_NODE) {
                        destination.appendChild(document.createTextNode(source.nodeValue || ''));
                        return;
                    }
                    if (source.nodeType !== Node.ELEMENT_NODE) return;
                    const tag = source.tagName.toUpperCase();
                    if (blockedTags.has(tag)) return;
                    if (!allowedTags.has(tag)) {
                        source.childNodes.forEach(child => copySafeNode(child, destination));
                        return;
                    }
                    const safeElement = document.createElement(tag === 'FONT' ? 'span' : tag.toLowerCase());
                    if (tag === 'A') {
                        try {
                            const linkUrl = new URL(source.getAttribute('href') || '', window.location.href);
                            if (['http:', 'https:', 'mailto:'].includes(linkUrl.protocol)) {
                                safeElement.setAttribute('href', linkUrl.href);
                                if (linkUrl.protocol !== 'mailto:') {
                                    safeElement.setAttribute('target', '_blank');
                                    safeElement.setAttribute('rel', 'noopener noreferrer');
                                }
                            }
                        } catch (e) { }
                    }
                    if (tag === 'SPAN' || tag === 'FONT') {
                        const color = tag === 'FONT' ? source.getAttribute('color') : source.style.color;
                        const colorProbe = document.createElement('span');
                        if (color && !/[;{}]/.test(color)) colorProbe.style.color = color;
                        if (colorProbe.style.color) safeElement.style.color = colorProbe.style.color;
                    }
                    destination.appendChild(safeElement);
                    source.childNodes.forEach(child => copySafeNode(child, safeElement));
                }

                parsed.body.childNodes.forEach(node => copySafeNode(node, cleanRoot));
                return cleanRoot.innerHTML;
            }

            // [수정] 탭 클릭 시 이벤트 제어 (1: 할일, 2: 텍스트 메모, 3: 컬러 도구, 4: 웹 사이트 등록)
            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (currentTab === '1') {
                        saveToStorage(); // 1번 할 일 탭일 때만 저장
                    }

                    currentTab = e.target.getAttribute('data-tab'); // 탭 번호 변경
                    tabBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    // 모든 뷰 숨김
                    todoView.style.display = 'none';
                    memoView.style.display = 'none';
                    colorToolView.style.display = 'none';
                    websiteToolView.style.display = 'none';
                    geminiView.style.display = 'none';

                    if (currentTab === '1') {
                        appTitle.innerHTML = '&lt; 할 일 관리 &gt;';
                        todoView.style.display = 'block';
                        renderCurrentTab();
                    } else if (currentTab === '2') {
                        appTitle.innerHTML = '&lt; 텍스트 메모 &gt;';
                        memoView.style.display = 'flex';
                    } else if (currentTab === '3') {
                        appTitle.innerHTML = '&lt; 컬러 도구 &gt;';
                        colorToolView.style.display = 'flex';
                    } else if (currentTab === '4') {
                        appTitle.innerHTML = '&lt; 웹 사이트 등록 &gt;';
                        websiteToolView.style.display = 'flex';
                    } else if (currentTab === '5') {
                        appTitle.innerHTML = '&lt; Gemini AI &gt;';
                        geminiView.style.display = 'flex';
                    }
                });
            });

            loadFromStorage();

            addBtn.addEventListener('click', () => {
                const text = input.value.trim();
                if (text === '') return; 
                createTodoElement(text, false);
                input.value = '';
                saveToStorage(); 
                setTimeout(resizeWindowToContent, 10);
            });

            todoList.addEventListener('click', (event) => {
                if (event.target.classList.contains('delete-btn')) {
                    event.target.parentElement.remove(); 
                    saveToStorage(); 
                    setTimeout(resizeWindowToContent, 10); 
                } 
                else if (event.target.classList.contains('todo-text')) {
                    event.target.classList.toggle('done'); 
                    saveToStorage(); 
                }
            });

            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') addBtn.click(); 
            });

            // Google 버튼
            googleBtn.addEventListener('click', () => {
                const targetWidth = 755; 
                const targetHeight = 660; 
                const features = `width=${targetWidth},height=${targetHeight},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`;
                window.open('https://www.google.com', 'GoogleSearchPopup', features);
            });

            // Papago 버튼
            papagoBtn.addEventListener('click', () => {
                const targetWidth = 400;  
                const targetHeight = 720; 
                const features = `width=${targetWidth},height=${targetHeight},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`;
                window.open('https://papago.naver.com/', 'PapagoPopup', features);
            });

            // '가져오기' 버튼은 향후 기능을 위해 남기되 현재 클릭 동작은 제거.
            importBtn.title = '추후 기능 예정';
            importBtn.addEventListener('click', () => {});
            // 숨겨진 JSON 파일 입력은 더 이상 호출하지 않음.

            let dbRevision = null;
            let dbLoaded = false;
            let dbSaving = false;

            async function loadFromNeonOnce() {
                const response = await fetch('/api/state', {credentials: 'same-origin', cache: 'no-store'});
                if (!response.ok) throw new Error('DB 불러오기 실패: HTTP ' + response.status);
                const payload = await response.json();
                const state = payload.data;
                if (!state || !state.tab1_todo || !Array.isArray(state.tab1_todo['1']) ||
                    typeof state.tab2_memo !== 'string' || !Array.isArray(state.tab4_bookmarks)) {
                    throw new Error('DB 데이터 형식이 올바르지 않습니다.');
                }
                const safeBookmarks = websiteTool.prepareBookmarks(state.tab4_bookmarks);
                if (!safeBookmarks) throw new Error('DB 북마크 형식이 올바르지 않습니다.');
                // 서버 데이터가 기준. 초기 로컬 데이터는 서버에 자동 업로드하지 않음.
                appData = {'1': state.tab1_todo['1']};
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                const safeMemo = sanitizeMemoHTML(state.tab2_memo);
                document.getElementById('memo-editor').innerHTML = safeMemo;
                localStorage.setItem('todoweb3_memo', safeMemo);
                websiteTool.replaceBookmarks(safeBookmarks);
                renderCurrentTab();
                dbRevision = payload.updated_at;
                dbLoaded = true;
            }
            window.todoWeb3LoadCloud = loadFromNeonOnce;

            exportBtn.addEventListener('click', async () => {
                if (!dbLoaded || dbSaving) {
                    alert('DB 불러오기가 완료되지 않았습니다.');
                    return;
                }
                dbSaving = true;
                exportBtn.disabled = true;
                const original = exportBtn.textContent;
                exportBtn.textContent = '저장 중...';
                try {
                    saveToStorage();
                    const data = {
                        tab1_todo: appData,
                        tab2_memo: sanitizeMemoHTML(document.getElementById('memo-editor').innerHTML),
                        tab4_bookmarks: websiteTool.getBookmarks()
                    };
                    const response = await fetch('/api/state', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({data, updated_at: dbRevision})
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        if (response.status === 409) {
                            alert('다른 창에서 DB가 변경되었습니다. 현재 내용을 별도로 보관한 후 새로고침해 주세요.');
                        } else {
                            alert('Neon 저장 실패: ' + (result.error || response.status));
                        }
                        return;
                    }
                    dbRevision = result.updated_at;
                    exportBtn.textContent = '✅ 저장됨';
                    setTimeout(() => {exportBtn.textContent = original;}, 1500);
                } catch (error) {
                    alert('저장 중 네트워크 오류가 발생했습니다: ' + error.message);
                } finally {
                    dbSaving = false;
                    exportBtn.disabled = false;
                    if (exportBtn.textContent === '저장 중...') exportBtn.textContent = original;
                }
            });

            // [추가] 3번 탭 MS 오피스 스타일 컬러 도구 로직
            function initColorTool() {
                const colorPreview = document.getElementById('color-preview');
                const nativeColorPicker = document.getElementById('native-color-picker');
                const hexInput = document.getElementById('hex-input');
                const rgbInput = document.getElementById('rgb-input');
                const copyHexBtn = document.getElementById('copy-hex-btn');
                const copyRgbBtn = document.getElementById('copy-rgb-btn');

                const redSlider = document.getElementById('red-slider');
                const greenSlider = document.getElementById('green-slider');
                const blueSlider = document.getElementById('blue-slider');
                const redNum = document.getElementById('red-num');
                const greenNum = document.getElementById('green-num');
                const blueNum = document.getElementById('blue-num');
                const presetPalette = document.getElementById('preset-palette');

                // 초기 색상: 가라형님이 보여주신 청록색 (42, 172, 160)
                let curR = 42;
                let curG = 172;
                let curB = 160;

                function componentToHex(c) {
                    const hex = Math.max(0, Math.min(255, c)).toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                }

                function rgbToHex(r, g, b) {
                    return ('#' + componentToHex(r) + componentToHex(g) + componentToHex(b)).toUpperCase();
                }

                function hexToRgb(hex) {
                    let cleanHex = hex.replace('#', '').trim();
                    if (cleanHex.length === 3) {
                        cleanHex = cleanHex.split('').map(c => c + c).join('');
                    }
                    if (cleanHex.length !== 6) return null;
                    const num = parseInt(cleanHex, 16);
                    if (isNaN(num)) return null;
                    return {
                        r: (num >> 16) & 255,
                        g: (num >> 8) & 255,
                        b: num & 255
                    };
                }

                function updateColorUI(fromSource) {
                    const hex = rgbToHex(curR, curG, curB);
                    const rgbStr = `rgb(${curR}, ${curG}, ${curB})`;

                    colorPreview.style.backgroundColor = hex;
                    rgbInput.value = rgbStr;

                    if (fromSource !== 'hex') hexInput.value = hex;
                    if (fromSource !== 'picker') nativeColorPicker.value = hex.toLowerCase();

                    if (fromSource !== 'slider') {
                        redSlider.value = curR;
                        greenSlider.value = curG;
                        blueSlider.value = curB;
                    }
                    if (fromSource !== 'number') {
                        redNum.value = curR;
                        greenNum.value = curG;
                        blueNum.value = curB;
                    }
                }

                // 슬라이더 조절 이벤트
                [redSlider, greenSlider, blueSlider].forEach(slider => {
                    slider.addEventListener('input', () => {
                        curR = parseInt(redSlider.value, 10) || 0;
                        curG = parseInt(greenSlider.value, 10) || 0;
                        curB = parseInt(blueSlider.value, 10) || 0;
                        updateColorUI('slider');
                    });
                });

                // 숫자 인풋 조절 이벤트
                [redNum, greenNum, blueNum].forEach(numInput => {
                    numInput.addEventListener('input', () => {
                        curR = Math.max(0, Math.min(255, parseInt(redNum.value, 10) || 0));
                        curG = Math.max(0, Math.min(255, parseInt(greenNum.value, 10) || 0));
                        curB = Math.max(0, Math.min(255, parseInt(blueNum.value, 10) || 0));
                        updateColorUI('number');
                    });
                });

                // 윈도우 네이티브 색상 선택기 연동 (창에서 색 고르면 즉시 동기화)
                nativeColorPicker.addEventListener('input', (e) => {
                    const rgb = hexToRgb(e.target.value);
                    if (rgb) {
                        curR = rgb.r;
                        curG = rgb.g;
                        curB = rgb.b;
                        updateColorUI('picker');
                    }
                });

                // HEX 직접 입력 연동
                hexInput.addEventListener('input', (e) => {
                    const rgb = hexToRgb(e.target.value);
                    if (rgb) {
                        curR = rgb.r;
                        curG = rgb.g;
                        curB = rgb.b;
                        updateColorUI('hex');
                    }
                });

                // 클립보드 원클릭 복사 함수
                function copyToClipboard(text, btnElement) {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text);
                    } else {
                        const tempArea = document.createElement('textarea');
                        tempArea.value = text;
                        document.body.appendChild(tempArea);
                        tempArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempArea);
                    }
                    const origText = btnElement.textContent;
                    btnElement.textContent = '✔ 복사됨';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.textContent = origText;
                        btnElement.classList.remove('copied');
                    }, 1200);
                }

                copyHexBtn.addEventListener('click', () => copyToClipboard(hexInput.value, copyHexBtn));
                copyRgbBtn.addEventListener('click', () => copyToClipboard(rgbInput.value, copyRgbBtn));

                // MS 오피스 표준 테마 색상 40가지 그리드 생성
                const officeColors = [
                    '#FFFFFF', '#000000', '#EEECE1', '#1F497D', '#4F81BD', '#C0504D', '#9BBB59', '#8064A2', '#4BACC6', '#F79646',
                    '#F2F2F2', '#7F7F7F', '#DDD9C3', '#C6D9F0', '#DBE5F1', '#F2DCDB', '#EBF1DD', '#E5E0EC', '#DBEEF3', '#FDEADA',
                    '#D9D9D9', '#595959', '#C4BD97', '#8DB3E2', '#B8CCE4', '#E5B9B7', '#D7E3BC', '#CCC1DA', '#B7DDE8', '#FBD5B5',
                    '#C00000', '#FF0000', '#FFC000', '#FFFF00', '#92D050', '#00B050', '#00B0F0', '#0070C0', '#002060', '#7030A0'
                ];

                officeColors.forEach(colorHex => {
                    const chip = document.createElement('div');
                    chip.className = 'color-chip';
                    chip.style.backgroundColor = colorHex;
                    chip.title = colorHex;
                    chip.addEventListener('click', () => {
                        const rgb = hexToRgb(colorHex);
                        if (rgb) {
                            curR = rgb.r;
                            curG = rgb.g;
                            curB = rgb.b;
                            updateColorUI();
                        }
                    });
                    presetPalette.appendChild(chip);
                });

                // 초기 색상 화면 렌더링
                updateColorUI();
            }

            initColorTool();

            // [추가] 4번 탭 웹 사이트 등록 (북마크) 로직
            function initWebsiteTool() {
                const bmNameInput = document.getElementById('bm-name-input');
                const bmUrlInput = document.getElementById('bm-url-input');
                const bmAddBtn = document.getElementById('bm-add-btn');
                const bmSearchInput = document.getElementById('bm-search-input');
                const bmList = document.getElementById('bm-list');

                const BM_STORAGE_KEY = 'todoweb3_bookmarks';
                const defaultBookmarks = [
                    { name: '노트북 LM - 등록 사이트', url: 'https://allnotebooklm.com/' },
                    { name: 'NB_LM - 철학이란 무엇인가?', url: 'https://notebook.google.com/notebook/ddccb57' },
                    { name: 'NB_LM - 셰익스피어', url: 'https://notebook.google.com/notebook/19bde485-' },
                    { name: '깃허브', url: 'https://github.com/' }
                ];

                let bookmarks = [];
                try {
                    const saved = localStorage.getItem(BM_STORAGE_KEY);
                    if (saved !== null) {
                        const normalized = normalizeBookmarkList(JSON.parse(saved));
                        if (!normalized) throw new Error('저장된 북마크 형식이 올바르지 않습니다.');
                        bookmarks = normalized;
                    } else {
                        bookmarks = defaultBookmarks;
                        localStorage.setItem(BM_STORAGE_KEY, JSON.stringify(bookmarks));
                    }
                } catch(e) {
                    bookmarks = defaultBookmarks;
                }

                function saveBookmarks() {
                    try {
                        localStorage.setItem(BM_STORAGE_KEY, JSON.stringify(bookmarks));
                    } catch(e) {}
                }

                function formatUrl(url) {
                    url = url.trim();
                    if (!/^https?:\/\//i.test(url)) {
                        url = 'https://' + url;
                    }
                    return url;
                }

                function normalizeBookmarkList(items) {
                    if (!Array.isArray(items)) return null;
                    const normalized = [];
                    for (const item of items) {
                        if (!item || typeof item.name !== 'string' || typeof item.url !== 'string') return null;
                        const name = item.name.trim();
                        if (!name || name.length > 200 || item.url.length > 2048) return null;
                        try {
                            const url = new URL(formatUrl(item.url));
                            if (!['http:', 'https:'].includes(url.protocol)) return null;
                            normalized.push({ name, url: url.href });
                        } catch (e) { return null; }
                    }
                    return normalized;
                }

                let draggedIndex = null;

                function renderBookmarks() {
                    bmList.innerHTML = '';
                    const query = bmSearchInput.value.toLowerCase().trim();

                    bookmarks.forEach((bm, index) => {
                        const matches = !query || bm.name.toLowerCase().includes(query) || bm.url.toLowerCase().includes(query);
                        if (!matches) return;

                        const li = document.createElement('li');
                        li.className = 'bm-item';
                        li.dataset.index = index;

                        // 드래그 핸들
                        const dragHandle = document.createElement('span');
                        dragHandle.className = 'bm-drag-handle';
                        dragHandle.textContent = '≡';
                        dragHandle.title = '드래그로 순서 변경';
                        dragHandle.draggable = true;

                        dragHandle.addEventListener('dragstart', (e) => {
                            if (bmSearchInput.value.trim()) {
                                e.preventDefault();
                                return;
                            }
                            draggedIndex = index;
                            li.classList.add('dragging');
                            e.dataTransfer.effectAllowed = 'move';
                            e.dataTransfer.setData('text/plain', String(index));
                        });

                        dragHandle.addEventListener('dragend', () => {
                            document.querySelectorAll('.bm-item').forEach(item => {
                                item.classList.remove('dragging', 'drag-over-before', 'drag-over-after');
                            });
                            draggedIndex = null;
                        });

                        // 링크 정보 영역
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'bm-info';

                        const link = document.createElement('a');
                        link.className = 'bm-link';
                        link.href = bm.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'bm-name';
                        nameSpan.textContent = bm.name;

                        const urlSpan = document.createElement('span');
                        urlSpan.className = 'bm-url';
                        urlSpan.textContent = `- ${bm.url}`;

                        link.appendChild(nameSpan);
                        link.appendChild(urlSpan);
                        infoDiv.appendChild(link);

                        // 삭제 버튼
                        const delBtn = document.createElement('button');
                        delBtn.type = 'button';
                        delBtn.className = 'bm-delete-btn';
                        delBtn.textContent = '✖';
                        delBtn.title = '삭제';
                        delBtn.addEventListener('click', () => {
                            if (confirm(`'${bm.name}' 사이트를 삭제하시겠습니까?`)) {
                                bookmarks.splice(index, 1);
                                saveBookmarks();
                                renderBookmarks();
                            }
                        });

                        // 드래그 앤 드롭 위치 감지 및 순서 변경
                        li.addEventListener('dragover', (e) => {
                            if (draggedIndex === null || draggedIndex === index) return;
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'move';
                            const rect = li.getBoundingClientRect();
                            const isBefore = e.clientY < rect.top + rect.height / 2;
                            li.classList.toggle('drag-over-before', isBefore);
                            li.classList.toggle('drag-over-after', !isBefore);
                        });

                        li.addEventListener('dragleave', (e) => {
                            if (!li.contains(e.relatedTarget)) {
                                li.classList.remove('drag-over-before', 'drag-over-after');
                            }
                        });

                        li.addEventListener('drop', (e) => {
                            e.preventDefault();
                            if (draggedIndex === null || draggedIndex === index) return;
                            const rect = li.getBoundingClientRect();
                            const isBefore = e.clientY < rect.top + rect.height / 2;

                            const movedItem = bookmarks.splice(draggedIndex, 1)[0];
                            let targetIdx = index;
                            if (draggedIndex < index) {
                                targetIdx = isBefore ? index - 1 : index;
                            } else {
                                targetIdx = isBefore ? index : index + 1;
                            }
                            targetIdx = Math.max(0, Math.min(bookmarks.length, targetIdx));

                            bookmarks.splice(targetIdx, 0, movedItem);
                            saveBookmarks();
                            renderBookmarks();
                        });

                        li.appendChild(dragHandle);
                        li.appendChild(infoDiv);
                        li.appendChild(delBtn);
                        bmList.appendChild(li);
                    });
                }

                function addBookmark() {
                    const name = bmNameInput.value.trim();
                    let url = bmUrlInput.value.trim();
                    if (!name || !url) {
                        alert('웹사이트 이름과 URL 주소를 모두 입력해주세요.');
                        return;
                    }
                    url = formatUrl(url);

                    bookmarks.unshift({ name, url });
                    saveBookmarks();
                    bmNameInput.value = '';
                    bmUrlInput.value = '';
                    bmSearchInput.value = '';
                    renderBookmarks();
                    bmNameInput.focus();
                }

                bmAddBtn.addEventListener('click', addBookmark);
                bmNameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') bmUrlInput.focus();
                });
                bmUrlInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') addBookmark();
                });

                bmSearchInput.addEventListener('input', renderBookmarks);

                // 초기 렌더링
                renderBookmarks();
                return {
                    prepareBookmarks: normalizeBookmarkList,
                    getBookmarks() {
                        return bookmarks.map(bookmark => ({ ...bookmark }));
                    },
                    replaceBookmarks(items) {
                        const normalized = normalizeBookmarkList(items);
                        if (!normalized) return false;
                        bookmarks = normalized;
                        saveBookmarks();
                        bmSearchInput.value = '';
                        renderBookmarks();
                        return true;
                    }
                };
            }

            // [추가] 2번 탭 텍스트 메모장 로직
            function initMemoTool() {
                const memoEditor = document.getElementById('memo-editor');
                const colorBtns = document.querySelectorAll('.memo-color-btn');
                const copyBtn = document.getElementById('memo-copy-btn');
                const MEMO_STORAGE_KEY = 'todoweb3_memo';

                // 이 버전 전용 메모만 불러옵니다.
                try {
                    const saved = localStorage.getItem(MEMO_STORAGE_KEY);
                    if (saved !== null) {
                        const safeMemo = sanitizeMemoHTML(saved);
                        memoEditor.innerHTML = safeMemo;
                        if (safeMemo !== saved) localStorage.setItem(MEMO_STORAGE_KEY, safeMemo);
                    }
                } catch(e) {}

                function saveMemo() {
                    try {
                        localStorage.setItem(MEMO_STORAGE_KEY, sanitizeMemoHTML(memoEditor.innerHTML));
                    } catch(e) {}
                }

                function insertSafeHTML(html, rangeOverride) {
                    const safeContainer = document.createElement('div');
                    safeContainer.innerHTML = sanitizeMemoHTML(html);
                    const selection = window.getSelection();
                    let range = rangeOverride || (selection && selection.rangeCount ? selection.getRangeAt(0) : null);

                    if (!range || !memoEditor.contains(range.commonAncestorContainer)) {
                        range = document.createRange();
                        range.selectNodeContents(memoEditor);
                        range.collapse(false);
                    }

                    range.deleteContents();
                    const fragment = document.createDocumentFragment();
                    while (safeContainer.firstChild) fragment.appendChild(safeContainer.firstChild);
                    const lastInsertedNode = fragment.lastChild;

                    if (lastInsertedNode) {
                        range.insertNode(fragment);
                        range.setStartAfter(lastInsertedNode);
                        range.collapse(true);
                        if (selection) {
                            selection.removeAllRanges();
                            selection.addRange(range);
                        }
                    }
                    saveMemo();
                }

                memoEditor.addEventListener('input', saveMemo);
                memoEditor.addEventListener('paste', (event) => {
                    const pastedHTML = event.clipboardData?.getData('text/html');
                    if (!pastedHTML) return;
                    event.preventDefault();
                    insertSafeHTML(pastedHTML);
                });
                memoEditor.addEventListener('drop', (event) => {
                    const droppedHTML = event.dataTransfer?.getData('text/html');
                    if (!droppedHTML) return;
                    event.preventDefault();

                    let dropRange = null;
                    if (document.caretRangeFromPoint) {
                        dropRange = document.caretRangeFromPoint(event.clientX, event.clientY);
                    } else if (document.caretPositionFromPoint) {
                        const position = document.caretPositionFromPoint(event.clientX, event.clientY);
                        if (position) {
                            dropRange = document.createRange();
                            dropRange.setStart(position.offsetNode, position.offset);
                            dropRange.collapse(true);
                        }
                    }
                    insertSafeHTML(droppedHTML, dropRange);
                });

                // 색상 버튼 클릭 처리 (5가지 기본 색상)
                colorBtns.forEach(btn => {
                    // 마우스 누를 때 에디터의 커서/선택영역 포커스를 잃지 않도록 방지
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                    });

                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const color = btn.getAttribute('data-color');

                        colorBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');

                        memoEditor.focus();
                        const sel = window.getSelection();

                        if (sel && sel.rangeCount > 0 && !sel.isCollapsed && memoEditor.contains(sel.anchorNode)) {
                            // 1. 드래그된 글자가 있으면 해당 글자들의 색상만 변경 (기존 글자 영향 없음)
                            document.execCommand('foreColor', false, color);
                        } else {
                            // 2. 글자 선택 없이 커서만 있는 경우:
                            // 기존 글자는 절대로 건드리지 않고, 앞으로 입력될 글자색을 위해 커서 위치에 색상 span 준비
                            document.execCommand('foreColor', false, color);

                            if (sel && sel.rangeCount > 0 && memoEditor.contains(sel.anchorNode)) {
                                const range = sel.getRangeAt(0);
                                const span = document.createElement('span');
                                span.style.color = color;
                                span.appendChild(document.createTextNode('\u200B')); // 폭 없는 공백
                                range.insertNode(span);
                                range.setStart(span.firstChild, 1);
                                range.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(range);
                            }
                        }
                        saveMemo();
                    });
                });

                // 전체 복사 기능
                copyBtn.addEventListener('click', () => {
                    const text = memoEditor.innerText || '';
                    if (!text.trim()) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text);
                    } else {
                        const tempArea = document.createElement('textarea');
                        tempArea.value = text;
                        document.body.appendChild(tempArea);
                        tempArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempArea);
                    }
                    const orig = copyBtn.innerHTML;
                    copyBtn.innerHTML = '✔ 복사됨!';
                    setTimeout(() => { copyBtn.innerHTML = orig; }, 1200);
                });
            }

            initMemoTool();
            websiteTool = initWebsiteTool();
            let selectedImage = null;
            const imageInput = document.getElementById('gemini-image-file');
            const imageStatus = document.getElementById('gemini-image-status');
            const uploadImageBtn = document.getElementById('gemini-upload-image');
            function setImage(image) {
                selectedImage = image;
                uploadImageBtn.disabled = !image;
                imageStatus.textContent = image ? '✅ 이미지 첨부 준비 완료 · Storage 미저장' : '';
            }
            async function base64Of(file) {
                return new Promise((resolve,reject) => {
                    const reader = new FileReader();
                    reader.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
                    reader.onload = () => resolve(String(reader.result).split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }
            document.getElementById('gemini-pick-image').addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', async () => {
                const file = imageInput.files?.[0];
                if (!file) return;
                if (file.size > 3*1024*1024 || !['image/png','image/jpeg','image/webp'].includes(file.type)) {
                    setImage(null); imageStatus.textContent = '❌ PNG/JPG/WEBP 3MB 이하만 지원'; return;
                }
                try {setImage({mimeType:file.type,data:await base64Of(file)});}
                catch(e) {setImage(null); imageStatus.textContent=e.message;}
            });
            document.getElementById('gemini-capture').addEventListener('click', async () => {
                if (!navigator.mediaDevices?.getDisplayMedia) {
                    imageStatus.textContent = '❌ 화면 공유를 지원하지 않는 브라우저입니다.'; return;
                }
                let stream;
                try {
                    // Browser mandates a user-mediated screen/window sharing dialog.
                    stream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
                    const video = document.createElement('video');
                    video.muted = true;
                    video.srcObject = stream;
                    await video.play();
                    if (!video.videoWidth || !video.videoHeight) throw new Error('화면 프레임을 가져올 수 없습니다.');
                    const frame = document.createElement('canvas');
                    frame.width = video.videoWidth; frame.height = video.videoHeight;
                    frame.getContext('2d').drawImage(video,0,0);
                    stream.getTracks().forEach(t=>t.stop()); stream=null;
                    const overlay = document.createElement('div');
                    overlay.style.cssText='position:fixed;inset:0;z-index:100000;background:#161616;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box;';
                    const caption = document.createElement('div');
                    caption.textContent='마우스로 영역을 드래그하면 자동 첨부됩니다. 다시 드래그해 재선택 가능';
                    caption.style.cssText='font-size:12px;text-align:center';
                    const canvas = document.createElement('canvas');
                    const ratio = Math.min((window.innerWidth-24)/frame.width,(window.innerHeight-110)/frame.height,1);
                    canvas.width=Math.max(1,Math.round(frame.width*ratio));
                    canvas.height=Math.max(1,Math.round(frame.height*ratio));
                    canvas.style.cssText='max-width:100%;border:1px solid white;cursor:crosshair;touch-action:none;';
                    const ctx=canvas.getContext('2d');
                    ctx.drawImage(frame,0,0,canvas.width,canvas.height);
                    const controls=document.createElement('div');
                    const close=document.createElement('button');
                    close.textContent='닫기';close.type='button';
                    close.onclick=()=>overlay.remove();
                    controls.appendChild(close);
                    overlay.append(caption,canvas,controls);
                    document.body.appendChild(overlay);
                    let startPoint=null,dragged=false;
                    function coords(event) {
                        const b=canvas.getBoundingClientRect();
                        return {x:Math.max(0,Math.min(frame.width,(event.clientX-b.left)*frame.width/b.width)),
                                y:Math.max(0,Math.min(frame.height,(event.clientY-b.top)*frame.height/b.height))};
                    }
                    function drawRect(a,b) {
                        ctx.drawImage(frame,0,0,canvas.width,canvas.height);
                        const sx=canvas.width/frame.width,sy=canvas.height/frame.height;
                        ctx.strokeStyle='#ffdf45';ctx.lineWidth=2;
                        ctx.strokeRect(a.x*sx,a.y*sy,(b.x-a.x)*sx,(b.y-a.y)*sy);
                    }
                    canvas.addEventListener('pointerdown',e=>{
                        startPoint=coords(e);dragged=false;canvas.setPointerCapture(e.pointerId);
                    });
                    canvas.addEventListener('pointermove',e=>{
                        if (!startPoint) return;
                        dragged=true;drawRect(startPoint,coords(e));
                    });
                    canvas.addEventListener('pointerup',e=>{
                        if (!startPoint) return;
                        const finish=coords(e), a=startPoint; startPoint=null;
                        if (!dragged) return;
                        const x=Math.round(Math.min(a.x,finish.x)),y=Math.round(Math.min(a.y,finish.y));
                        const w=Math.round(Math.abs(a.x-finish.x)),h=Math.round(Math.abs(a.y-finish.y));
                        if (w<10||h<10) {caption.textContent='영역을 조금 더 크게 지정해 주세요.';return;}
                        const output=document.createElement('canvas');
                        const scale=Math.min(1,1600/Math.max(w,h));
                        output.width=Math.max(1,Math.round(w*scale));
                        output.height=Math.max(1,Math.round(h*scale));
                        output.getContext('2d').drawImage(frame,x,y,w,h,0,0,output.width,output.height);
                        let quality=.85, encoded='';
                        do {encoded=output.toDataURL('image/jpeg',quality).split(',')[1];quality-=.12;}
                        while(encoded.length>2750000 && quality>.3);
                        if(encoded.length>2750000) {caption.textContent='캡처 이미지가 2MB를 초과합니다. 작은 영역을 선택해 주세요.';return;}
                        setImage({mimeType:'image/jpeg',data:encoded});
                        overlay.remove();
                    });
                } catch(e) {
                    imageStatus.textContent=e.name==='NotAllowedError'?'화면 공유가 취소되었습니다.':'❌ 캡처 오류: '+e.message;
                } finally {if(stream)stream.getTracks().forEach(t=>t.stop());}
            });
            uploadImageBtn.addEventListener('click', async () => {
                if (!selectedImage) return;
                uploadImageBtn.disabled=true;
                imageStatus.textContent='Neon Storage 저장 중...';
                try {
                    const response=await fetch('/api/upload-image',{
                        method:'POST',credentials:'same-origin',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({mimeType:selectedImage.mimeType,image:selectedImage.data})
                    });
                    const result=await response.json();
                    if(!response.ok)throw new Error(result.error || '업로드 오류');
                    imageStatus.textContent='✅ Storage 저장 완료 · Gemini 첨부 준비 완료';
                } catch(e) {imageStatus.textContent='❌ '+e.message;}
                finally {uploadImageBtn.disabled=false;}
            });
            document.getElementById('gemini-storage-list').addEventListener('click', async () => {
                const old = document.getElementById('gemini-storage-panel');
                if (old) { old.remove(); return; }
                const panel = document.createElement('div');
                panel.id='gemini-storage-panel';
                panel.style.cssText='background:#fff;border:1px solid #999;max-height:220px;overflow:auto;padding:5px;font-size:12px;';
                panel.textContent='Neon 이미지 목록 불러오는 중...';
                document.getElementById('gemini-answer').before(panel);
                try {
                    const response=await fetch('/api/storage-images',{credentials:'same-origin',cache:'no-store'});
                    const result=await response.json();
                    if(!response.ok) throw Error(result.error||'목록 오류');
                    panel.replaceChildren();
                    if(!result.items?.length) {panel.textContent='저장된 이미지가 없습니다.';return;}
                    for(const item of result.items) {
                        const row=document.createElement('div');
                        row.style.cssText='display:flex;gap:4px;align-items:center;border-bottom:1px solid #ddd;padding:4px 0;';
                        const name=document.createElement('span');
                        name.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                        name.title=item.key;
                        name.textContent=item.key.split('/').pop()+' ('+Math.round(item.size/1024)+'KB)';
                        const view=document.createElement('button');
                        view.textContent='열기';
                        view.onclick=async()=>{
                            try {
                                const response=await fetch('/api/storage-images?key='+encodeURIComponent(item.key),{credentials:'same-origin'});
                                const result=await response.json();
                                if(!response.ok)throw Error(result.error||'URL 생성 실패');
                                window.open(result.url,'_blank','noopener,noreferrer');
                            }catch(e){imageStatus.textContent='❌ '+e.message;}
                        };
                        const attach=document.createElement('button');
                        attach.textContent='첨부';
                        attach.onclick=async()=>{
                            attach.disabled=true;
                            try {
                                const response=await fetch('/api/storage-images?mode=data&key='+encodeURIComponent(item.key),{credentials:'same-origin'});
                                const result=await response.json();
                                if(!response.ok)throw Error(result.error||'이미지 불러오기 실패');
                                setImage({mimeType:result.mimeType,data:result.data});
                                imageStatus.textContent='✅ 보관함 이미지 첨부 준비 완료';
                                panel.remove();
                            }catch(e){imageStatus.textContent='❌ '+e.message;}
                            finally {attach.disabled=false;}
                        };
                        row.append(name,view,attach);panel.appendChild(row);
                    }
                    if(result.truncated) {
                        const note=document.createElement('p');note.textContent='최신 100개 이외의 파일은 Neon 콘솔에서 확인하세요.';panel.appendChild(note);
                    }
                }catch(e){panel.textContent='❌ '+e.message;}
            });
            const geminiQuestion = document.getElementById('gemini-question');
            const geminiSend = document.getElementById('gemini-send');
            const geminiStatus = document.getElementById('gemini-status');
            const geminiAnswer = document.getElementById('gemini-answer');
            geminiSend.addEventListener('click', async () => {
                const question = geminiQuestion.value.trim();
                if (!question) {geminiStatus.textContent='질문을 입력해 주세요.'; return;}
                geminiSend.disabled=true;geminiStatus.textContent='답변 생성 중...';
                try {
                    const response=await fetch('/api/gemini',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({question, ...(selectedImage ? {inlineImage:selectedImage} : {})})});
                    const result=await response.json();
                    if(!response.ok) throw new Error(result.error || 'API 오류');
                    geminiAnswer.textContent=result.answer;geminiStatus.textContent='완료 · '+(result.model || 'Gemini');
                } catch(e) {geminiStatus.textContent='오류';geminiAnswer.textContent=e.message;}
                finally {geminiSend.disabled=false;}
            });
        }

        // PIN gate: protects the visible app and checks the HttpOnly session server-side.
        function setupPinLock() {
            const overlay = document.createElement('div');
            overlay.id = 'pin-lock';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff7c9;display:flex;align-items:center;justify-content:center;padding:15px;box-sizing:border-box;';
            overlay.innerHTML = `
                <form id="pin-form" style="display:flex;align-items:center;gap:6px;max-width:100%">
                    <label for="pin-code" style="font-size:13px;font-weight:bold">PIN</label>
                    <input id="pin-code" type="password" inputmode="numeric" pattern="[0-9]{4}"
                       maxlength="4" autocomplete="off" aria-label="4자리 PIN"
                       style="width:58px;height:30px;text-align:center;font-size:16px;letter-spacing:2px;box-sizing:border-box;border:1px solid #999;border-radius:4px">
                    <button type="submit" style="height:30px">확인</button>
                </form>
                <div id="pin-error" role="alert" style="position:absolute;top:calc(50% + 32px);font-size:12px;color:#b91c1c;text-align:center;padding:0 10px"></div>`;
            document.body.appendChild(overlay);
            const field = document.getElementById('pin-code');
            const form = document.getElementById('pin-form');
            const error = document.getElementById('pin-error');
            const button = form.querySelector('button');
            field.addEventListener('input', () => {
                field.value = field.value.replace(/[^0-9]/g, '').slice(0, 4);
                error.textContent = '';
            });
            async function request(method, data) {
                const response = await fetch('/api/auth', {
                    method,
                    headers: data ? {'Content-Type': 'application/json'} : {},
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: data ? JSON.stringify(data) : undefined
                });
                const result = await response.json();
                return { response, result };
            }
            request('GET').then(({result}) => {
                if (result.authenticated) {
                    window.todoWeb3LoadCloud().then(() => overlay.remove()).catch(e => { error.textContent = e.message; });
                }
                else field.focus();
            }).catch(() => {
                error.textContent = '서버 연결을 확인해 주세요.';
            });
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!/^\d{4}$/.test(field.value)) {
                    error.textContent = '숫자 4자리를 입력해 주세요.';
                    return;
                }
                button.disabled = true;
                try {
                    const {response, result} = await request('POST', {pin: field.value});
                    if (response.ok && result.authenticated) {
                        field.value = '';
                        await window.todoWeb3LoadCloud();
                        overlay.remove();
                    } else {
                        error.textContent = response.status === 429
                            ? '시도가 많습니다. 약 15분 후 다시 시도해 주세요.'
                            : response.status === 401 ? 'PIN 번호가 다릅니다.' : '인증 오류가 발생했습니다.';
                        field.value = '';
                        field.focus();
                    }
                } catch {
                    error.textContent = '서버 연결 오류가 발생했습니다.';
                } finally {
                    button.disabled = false;
                }
            });
        }
    </script>
